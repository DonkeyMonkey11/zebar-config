<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
<link rel="stylesheet" type="text/css" href="./styles.css?v=93" />

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      // Auto-reload ao acordar da suspensao
      (() => {
        let hiddenAt = null;
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') {
            hiddenAt = Date.now();
          } else if (document.visibilityState === 'visible' && hiddenAt) {
            if (Date.now() - hiddenAt > 15000) { // ficou oculto > 15s = suspensao
              setTimeout(() => window.location.reload(), 5000);
            }
            hiddenAt = null;
          }
        });
      })();

      import React, {
        useState,
        useEffect,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.3.1';

      const providers = zebar.createProviderGroup({
        audio: { type: 'audio' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEEE d MMMM', locale: 'pt-BR' },
        time: { type: 'date', formatting: 'HH:mm', locale: 'pt-BR' },
        battery: { type: 'battery' },
        memory: { type: 'memory' },
        media: { type: 'media' },
        weather: { type: 'weather', latitude: -23.5505, longitude: -46.6333 },
      });

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        // Ativa/desativa o gatinho animado (neko). Mude para true para reativar.
        const SHOW_NEKO = false;
        const [output, setOutput] = useState(providers.outputMap);
        const [powerOpen, setPowerOpen] = useState(false);
        const [focusedApp, setFocusedApp] = useState({ processName: '', title: '' });
        const [cachedWeather, setCachedWeather] = useState(null);
        const [hasUpdates, setHasUpdates] = useState(false);
        const [sunTimes, setSunTimes] = useState(null);

        // Spinner de terminal (estilo "npm install") pra preencher o espaco vazio.
        const SHOW_DEV_SPINNER = true;
        const SPINNER_FRAMES = ['⣋','⣙','⢻','⠼','⣴','⣦','⣇','⢏'];
        const [spinnerFrame, setSpinnerFrame] = useState(0);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        useEffect(() => {
          if (!SHOW_DEV_SPINNER) return;
          const id = setInterval(() => {
            setSpinnerFrame(f => (f + 1) % SPINNER_FRAMES.length);
          }, 90);
          return () => clearInterval(id);
        }, []);

        useEffect(() => {
          if (output.weather) setCachedWeather(output.weather);
        }, [output.weather]);

        useEffect(() => {
          let cancelled = false;
          async function loadSunTimes() {
            try {
              const res = await fetch(
                'https://api.open-meteo.com/v1/forecast?latitude=-23.5505&longitude=-46.6333&daily=sunrise,sunset&timezone=auto&forecast_days=1',
              );
              const data = await res.json();
              if (cancelled || !data.daily?.sunrise?.length) return;
              setSunTimes({
                sunrise: new Date(data.daily.sunrise[0]),
                sunset: new Date(data.daily.sunset[0]),
              });
            } catch {}
          }
          loadSunTimes();
          const id = setInterval(loadSunTimes, 3600000);
          return () => { cancelled = true; clearInterval(id); };
        }, []);

        useEffect(() => {
          function checkUpdates() {
            fetch('http://localhost:6127/')
              .then(r => r.json())
              .then(d => setHasUpdates(d.hasUpdates))
              .catch(() => {});
          }
          checkUpdates();
          const id = setInterval(checkUpdates, 1800000); // 30 min
          return () => clearInterval(id);
        }, []);

        useEffect(() => {
          let ws, timer;
          function connect() {
            ws = new WebSocket('ws://localhost:6123');
            ws.onopen = () => {
              ws.send('query focused');
              timer = setInterval(() => { if (ws.readyState === 1) ws.send('query focused'); }, 600);
            };
            ws.onmessage = (e) => {
              try {
                const m = JSON.parse(e.data);
                if (m.data?.focused?.processName !== undefined) {
                  setFocusedApp({ processName: m.data.focused.processName || '', title: m.data.focused.title || '' });
                }
              } catch {}
            };
            ws.onclose = () => { clearInterval(timer); setTimeout(connect, 2000); };
            ws.onerror = () => {};
          }
          connect();
          return () => { clearInterval(timer); ws?.close(); };
        }, []);

        function getVisualizerColor(sessionId) {
          const id = (sessionId || '').toLowerCase();
          if (id.includes('spotify'))                    return '#1db954'; // verde Spotify
          if (id.includes('brave'))                      return '#fb542b'; // laranja Brave
          if (id.includes('zen'))                        return '#ea4335'; // vermelho Zen
          if (id.includes('firefox'))                    return '#ff7139'; // laranja Firefox
          if (id.includes('edge'))                       return '#0078d4'; // azul Edge
          if (id.includes('youtube'))                    return '#ff0000'; // vermelho YouTube
          if (id.includes('vlc'))                        return '#ff8800'; // laranja VLC
          return 'rgba(115, 130, 175, 0.95)';                              // cor padrão
        }

        function getUsageColor(usage) {
          if (usage > 85) return '#f38ba8';
          if (usage > 50) return '#f9e2af';
          return '#a6e3a1';
        }

        function getAppName(processName, title) {
          const proc = (processName || '').toLowerCase();
          const t = title || '';
          // Detectar sites pelo título (antes do parse geral)
          const sites = [
            // Redes sociais / comunicação
            ['YouTube', 'YouTube'], ['Twitter', 'Twitter'], ['Instagram', 'Instagram'],
            ['Telegram', 'Telegram'], ['/ X', 'X'], ['Substack', 'Substack'],
            // Email / produtividade
            ['Tuta', 'Tuta Mail'], ['Gmail', 'Gmail'], ['Proton Mail', 'Proton Mail'],
            ['NotebookLM', 'NotebookLM'], ['Claude', 'Claude'], ['OpenRouter', 'OpenRouter'],
            // Entretenimento
            ['Twitch', 'Twitch'], ['Netflix', 'Netflix'], ['Spotify', 'Spotify'],
            // Ferramentas
            ['DuckDuckGo', 'DuckDuckGo'], ['DeepL', 'DeepL'],
            ['Practice', 'KeyBr'], ['Monkeytype', 'MonkeyType'],
            // Compras / finanças
            ['OneDrive', 'OneDrive'],
            ['Mercado Livre', 'Mercado Livre'], ['MercadoLivre', 'Mercado Livre'],
            ['mercadolivre', 'Mercado Livre'], ['meli', 'Mercado Livre'],
            ['Amazon', 'Amazon'], ['amazon.com', 'Amazon'],
            ['AliExpress', 'AliExpress'], ['Aliexpress', 'AliExpress'], ['aliexpress', 'AliExpress'],
            ['Hotmart', 'Hotmart'], ['Nutror', 'Nutror'], ['Avenue', 'Avenue'],
            ['Usado, Seminovo ou Novo', 'WebMotors'], ['Ofertas em', 'WebMotors'], ['WebMotors', 'WebMotors'], ['webmotors', 'WebMotors'],
            ['Keychron', 'Keychron'], ['keychron', 'Keychron'],
            // Cripto / Bitcoin
            ['Area Bitcoin', 'Area Bitcoin'], ['AreaBitcoin', 'Area Bitcoin'],
            ['Bitcoin BR', 'Bitcoin BR'], ['BitcoinBR', 'Bitcoin BR'],
            ['F2Pool', 'F2Pool'], ['f2pool', 'F2Pool'],
            ['mempool', 'Mempool'], ['Mempool', 'Mempool'],
          ];
          for (const [kw, name] of sites) if (t.includes(kw)) return name;
          // Apps nativos
          // Explorer: extrai nome da pasta atual do título
          if (proc.includes('explorer')) {
            const parts = t.split('\u2013').map(s => s.trim());
            const folderName = parts[0] || 'Explorador';
            // Pastas do OneDrive
            const oneDriveFolders = ['Donkey', 'Pessoal', 'Cofre Pessoal', 'OneDrive'];
            if (oneDriveFolders.some(f => folderName.includes(f))) return 'OneDrive';
            return folderName;
          }
          const map = { 'code':'VS Code','discord':'Discord','spotify':'Spotify','whatsapp':'WhatsApp',
            'slack':'Slack','windowsterminal':'Terminal','hyper':'Hyper','warp':'Warp',
            'zoom':'Zoom','teams':'Teams','figma':'Figma',
            'telegram':'Telegram','signal':'Signal','notion':'Notion','obsidian':'Obsidian',
            'postman':'Postman','insomnia':'Insomnia','gimp':'GIMP','vlc':'VLC' };
          const browsers = ['chrome','brave','firefox','msedge','zen','opera','vivaldi'];
          for (const [k,v] of Object.entries(map)) if (proc.includes(k)) return v;
          // Navegador genérico: extrai título da página
          if (browsers.some(b => proc.includes(b))) {
            const parts = t.split(' - ');
            return parts.length > 1 ? parts.slice(0, -1).join(' - ') : t.split(' | ')[0];
          }
          return t.split(' - ')[0].slice(0, 30) || processName?.replace(/\.exe$/i,'') || '';
        }

        function runPower(command) {
          output.glazewm?.runCommand(command);
          setPowerOpen(false);
        }

        // Get icon to show for current output volume/mute status.
        function getVolumeIcon(device) {
          if (!device || device.isMuted || device.volume === 0) {
            return <i className="nf nf-md-volume_mute"></i>;
          }
          if (device.volume < 30) {
            return <i className="nf nf-md-volume_low"></i>;
          }
          if (device.volume < 70) {
            return <i className="nf nf-md-volume_medium"></i>;
          }
          return <i className="nf nf-md-volume_high"></i>;
        }

        // Get icon to show for how much of the battery is charged.
        function getBatteryIcon(batteryOutput) {
          if (batteryOutput.chargePercent > 90)
            return <i className="nf nf-fa-battery_4"></i>;
          if (batteryOutput.chargePercent > 70)
            return <i className="nf nf-fa-battery_3"></i>;
          if (batteryOutput.chargePercent > 40)
            return <i className="nf nf-fa-battery_2"></i>;
          if (batteryOutput.chargePercent > 20)
            return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        // Weather icon from Zebar weather provider status.
        function getWeatherIcon(status, isDay) {
          const base = (status || '').replace(/_(day|night)$/, '');
          let icon, color;
          switch (base) {
            case 'thunder':
              icon = 'nf-md-weather_lightning'; color = '#f9e2af'; break;
            case 'snow':
              icon = 'nf-md-weather_snowy'; color = '#cdd6f4'; break;
            case 'heavy_rain':
              icon = 'nf-md-weather_pouring'; color = '#89dceb'; break;
            case 'light_rain':
              icon = 'nf-md-weather_rainy'; color = '#89dceb'; break;
            case 'cloudy':
              icon = isDay ? 'nf-md-weather_partly_cloudy' : 'nf-md-weather_cloudy';
              color = '#a6adc8'; break;
            case 'clear':
              icon = isDay ? 'nf-md-weather_sunny' : 'nf-md-moon_waning_crescent';
              color = isDay ? '#f9e2af' : '#fff'; break;
            default:
              icon = isDay ? 'nf-md-weather_sunny' : 'nf-md-moon_waning_crescent';
              color = isDay ? '#f9e2af' : '#fff'; break;
          }
          return <i className={`nf ${icon}${icon.includes('moon') ? ' weather-moon' : ''}`} style={{ color }}></i>;
        }

        return (
          <div className="app">
            <div className="left">
              <i
                className="pacman nf nf-md-pac_man"
                title="Configurações"
                onClick={() => output.glazewm?.runCommand('shell-exec ms-settings:')}
                style={{ cursor: 'pointer' }}
              ></i>
              <i
                className="logo nf nf-md-ghost"
                title="Explorador de Arquivos"
                onClick={() => output.glazewm?.runCommand('shell-exec explorer.exe')}
                style={{ cursor: 'pointer' }}
              ></i>
              <i
                className="ghost-mauve nf nf-md-ghost"
                title="Imagens"
                onClick={() => output.glazewm?.runCommand('shell-exec explorer.exe shell:My Pictures')}
                style={{ cursor: 'pointer' }}
              ></i>
              <i
                className="ghost-sky nf nf-md-ghost"
                title="OneDrive"
                onClick={() => output.glazewm?.runCommand('shell-exec explorer.exe shell:OneDrive')}
                style={{ cursor: 'pointer' }}
              ></i>
              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(workspace => {
                    const appName = workspace.hasFocus ? getAppName(focusedApp.processName, focusedApp.title) : '';
                    return (
                      <button
                        className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                        onClick={() => output.glazewm.runCommand(`focus --workspace ${workspace.name}`)}
                        title={workspace.displayName ?? workspace.name}
                        key={workspace.name}
                      >
                        {workspace.hasFocus ? (appName || (workspace.displayName ?? workspace.name)) : (workspace.displayName ?? workspace.name)}
                      </button>
                    );
                  })}
                </div>
              )}
              {output.media?.currentSession?.title && (() => {
                const proc = (focusedApp.processName || '').toLowerCase();
                const isMediaFocused = ['chrome','brave','firefox','msedge','zen','opera','vivaldi','spotify','vlc'].some(a => proc.includes(a));
                if (!isMediaFocused) return null;
                return (
                  <div
                    className="media"
                    onClick={() => output.media.togglePlayPause()}
                    title="Play/Pause"
                  >
                    <div
                      className={`visualizer ${output.media.currentSession.isPlaying ? 'playing' : 'paused'}`}
                      style={{ '--viz-color': getVisualizerColor(output.media.currentSession.sessionId) }}
                    >
                      <span></span><span></span><span></span><span></span>
                    </div>
                    <span className="media-text">
                      {output.media.currentSession.title}
                      {output.media.currentSession.artist
                        ? ` — ${output.media.currentSession.artist}`
                        : ''}
                    </span>
                  </div>
                );
              })()}
            </div>

            <div className="center">
              <div className="center-left-group">
                <span className="date-with-coffee">
                  <div className="coffee-wrapper" title="☕ Café">
                    <i
                      className="nf nf-fa-coffee coffee-icon"
                      style={{
                        fontSize: 'calc(var(--icon-size) * 1.1)',
                        color: '#fab387',
                        marginRight: 0
                      }}
                    ></i>
                    <span className="coffee-steam s1"></span>
                    <span className="coffee-steam s2"></span>
                    <span className="coffee-steam s3"></span>
                  </div>
                  <span
                    className="date-text"
                    title="Ver calendário"
                    onClick={() => zebar.startWidgetPreset('calendar-popup', 'default')}
                  >
                    {output.date?.formatted?.replace('-feira', '')}
                  </span>
                </span>
              </div>
              <span className="separator"></span>
              <div className="center-right-group">
                <span className="time-block">{output.time?.formatted}</span>
                {(output.weather || cachedWeather) && (() => {
                  const w = output.weather || cachedWeather;
                  const isDayNow = sunTimes
                    ? Date.now() >= sunTimes.sunrise.getTime() &&
                      Date.now() < sunTimes.sunset.getTime()
                    : (w.isDaytime ?? true);
                  return (
                    <span className="center-weather">
                      {getWeatherIcon(w.status, isDayNow)}
                      {Math.round(w.celsiusTemp)}°C
                    </span>
                  );
                })()}
              </div>
            </div>

            <div className="right">
              {SHOW_NEKO && <div className="bar-cat" title="Neko"></div>}
              {SHOW_DEV_SPINNER && (
                <span className="dev-spinner" title="Sempre compilando algo...">
                  {SPINNER_FRAMES[spinnerFrame]}
                </span>
              )}
              {output.glazewm && (
                <>
                  {output.glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() =>
                        output.glazewm.runCommand('wm-toggle-pause')
                      }
                    >
                      PAUSED
                    </button>
                  )}
                  {output.glazewm.bindingModes.map(bindingMode => (
                    <button
                      className="binding-mode"
                      key={bindingMode.name}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `wm-disable-binding-mode --name ${bindingMode.name}`,
                        )
                      }
                    >
                      {bindingMode.displayName ?? bindingMode.name}
                    </button>
                  ))}

                  <span className="ecg-bridge" title="Batimento cardíaco"></span>
                  <button
                    className={`tiling-direction nf ${
                      output.glazewm.tilingDirection === 'horizontal'
                        ? 'nf-md-swap_horizontal'
                        : 'nf-md-swap_vertical'
                    }`}
                    onClick={() =>
                      output.glazewm.runCommand('toggle-tiling-direction')
                    }
                  ></button>
                </>
              )}

              {output.cpu && (
                <div
                  className={`cpu ${output.cpu.usage > 85 ? 'high-usage' : ''}`}
                  title={`CPU: ${Math.round(output.cpu.usage)}%`}
                >
                  <span className="usage-label">CPU</span>
                  {[1, 2, 3, 4, 5].map(n => (
                    <span
                      key={n}
                      className={`seg${output.cpu.usage >= n * 20 ? ' on' : ''}`}
                      style={
                        output.cpu.usage >= n * 20
                          ? { '--seg-color': getUsageColor(output.cpu.usage) }
                          : undefined
                      }
                    ></span>
                  ))}
                </div>
              )}

              {output.memory && (
                <div
                  className={`memory ${output.memory.usage > 85 ? 'high-usage' : ''}`}
                  title={`Memória: ${Math.round(output.memory.usage)}%`}
                >
                  <span className="usage-label">MEM</span>
                  {[1, 2, 3, 4, 5].map(n => (
                    <span
                      key={n}
                      className={`seg${output.memory.usage >= n * 20 ? ' on' : ''}`}
                      style={
                        output.memory.usage >= n * 20
                          ? { '--seg-color': getUsageColor(output.memory.usage) }
                          : undefined
                      }
                    ></span>
                  ))}
                </div>
              )}

              {output.battery && (
                <div className="battery">
                  {/* Show icon for whether battery is charging. */}
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {getBatteryIcon(output.battery)}
                  {Math.round(output.battery.chargePercent)}%
                </div>
              )}

              <div
                className="update-bell"
                title={hasUpdates ? 'Atualizações pendentes' : 'Sistema atualizado'}
                onClick={() => output.glazewm?.runCommand('shell-exec ms-settings:windowsupdate')}
              >
                <i
                  className="nf nf-md-bell"
                  style={{
                    fontSize: 'calc(var(--icon-size) * 1.2)',
                    color: 'var(--icon-color-dark)',
                    marginRight: 0
                  }}
                ></i>
                {hasUpdates && <span className="update-dot"></span>}
              </div>

              <div
                className="bluetooth"
                title="Bluetooth"
                onClick={() => output.glazewm?.runCommand('shell-exec ms-settings:bluetooth')}
                style={{ cursor: 'pointer' }}
              >
                <i className="nf nf-md-bluetooth"></i>
              </div>

              {output.audio && (
                <div
                  className="volume"
                  title={`Volume: ${output.audio.defaultPlaybackDevice?.volume ?? 0}% — clique para mutar, role para ajustar`}
                  onClick={() => {
                    const device = output.audio.defaultPlaybackDevice;
                    if (device) output.audio.setMute(!device.isMuted);
                  }}
                  onWheel={(e) => {
                    const device = output.audio.defaultPlaybackDevice;
                    if (!device) return;
                    const delta = e.deltaY < 0 ? 5 : -5;
                    const newVolume = Math.max(0, Math.min(100, device.volume + delta));
                    output.audio
                      .setVolume(newVolume, { deviceId: device.deviceId })
                      .catch(err => console.error('setVolume failed', err));
                  }}
                  style={{ cursor: 'pointer' }}
                >
                  {getVolumeIcon(output.audio.defaultPlaybackDevice)}
                </div>
              )}

              <div className="power">
                {powerOpen && (
                  <>
                    <button
                      className="power-action"
                      title="Bloquear"
                      onClick={() =>
                        runPower(
                          'shell-exec rundll32.exe user32.dll,LockWorkStation',
                        )
                      }
                    >
                      <i className="nf nf-md-lock"></i>
                    </button>
                    <button
                      className="power-action"
                      title="Suspender"
                      onClick={() =>
                        runPower(
                          'shell-exec rundll32.exe powrprof.dll,SetSuspendState 0,1,0',
                        )
                      }
                    >
                      <i className="nf nf-md-power_sleep"></i>
                    </button>
                    <button
                      className="power-action"
                      title="Reiniciar"
                      onClick={() => runPower('shell-exec shutdown /r /t 0')}
                    >
                      <i className="nf nf-md-restart"></i>
                    </button>
                    <button
                      className="power-action"
                      title="Desligar"
                      onClick={() => runPower('shell-exec shutdown /s /t 0')}
                    >
                      <i className="nf nf-md-power_standby"></i>
                    </button>
                  </>
                )}
                <button
                  className={`power-action power-toggle ${powerOpen ? 'open' : ''}`}
                  title="Energia"
                  onClick={() => setPowerOpen(!powerOpen)}
                >
                  <i className="nf nf-md-power"></i>
                </button>
              </div>

            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
